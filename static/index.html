<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub Weather Risk</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6778; --border: #dde1e7;
    --accent: #1f5fbf; --accent-text: #ffffff; --user: #e8f0fc; --code: #f1f3f6; --warn: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --text: #e4e7ec; --muted: #9aa3b2; --border: #2e343e;
            --accent: #5b9bf5; --accent-text: #0d1117; --user: #1f2b3d; --code: #161a20; --warn: #e0b355; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; min-height: 100vh; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 4px 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  button { font: inherit; cursor: pointer; border-radius: 6px; }
  .ghost { background: none; border: 1px solid var(--border); color: var(--text); padding: 4px 10px; }
  #log { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: 12px; }
  .msg { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
  .msg.user { background: var(--user); align-self: flex-end; max-width: 85%; }
  .msg p { margin: 0 0 8px; white-space: pre-line; } .msg p:last-child { margin-bottom: 0; }
  /* pre-line keeps single line breaks from the answer (one hub per line); text is still plain text */
  .meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .caveats { color: var(--warn); font-size: 13px; margin: 8px 0 0; padding-left: 18px; }
  details { margin-top: 8px; font-size: 13px; }
  summary { cursor: pointer; color: var(--accent); }
  pre { background: var(--code); border: 1px solid var(--border); border-radius: 6px; padding: 8px;
        overflow: auto; max-height: 320px; font-size: 12px; white-space: pre; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; font-size: 13px; }
  form { display: flex; gap: 8px; position: sticky; bottom: 0; background: var(--bg); padding: 8px 0; }
  input { flex: 1; min-width: 0; font: inherit; padding: 10px; border-radius: 6px;
          border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  .send { background: var(--accent); color: var(--accent-text); border: 0; padding: 0 16px; }
  .send:disabled { opacity: .5; cursor: default; }
  footer { color: var(--muted); font-size: 11px; padding: 8px 0; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Hub Weather Risk</h1>
      <p class="sub">10 hubs · winter, flood, severe storms, hurricanes, heat · scores from code, explanations from Gemini</p>
    </div>
    <button class="ghost" id="new">New chat</button>
  </header>

  <div class="chips" id="chips"></div>
  <div id="log"></div>

  <form id="form">
    <input id="input" placeholder="Ask about hub weather exposure…" autocomplete="off" required>
    <button class="send" id="send">Send</button>
  </form>
  <footer>Data: Open-Meteo.com (CC BY 4.0) · FEMA OpenFEMA API (not endorsed by FEMA) · NOAA SPC hail reports.
    Decision support, not an investment decision.</footer>
</main>

<script>
const EXAMPLES = [
  "Which hubs in the Midwest are most exposed to winter disruption?",
  "Compare Miami and Houston in terms of hurricane and flood exposure.",
  "What percentage of days in Denver last year had snowfall?",
  "Why is the Dallas hub's weather disruption risk high?",
];
const log = document.getElementById("log"), input = document.getElementById("input"),
      send = document.getElementById("send");

// Session id: kept per browser tab so a reload keeps the conversation.
// Storage can be unavailable (private mode), so every access is guarded.
let sessionId = null;
try { sessionId = sessionStorage.getItem("session_id"); } catch (e) {}
function setSession(id) { sessionId = id; try { id ? sessionStorage.setItem("session_id", id) : sessionStorage.removeItem("session_id"); } catch (e) {} }

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// Minimal, safe formatting: text is inserted with textContent; only **bold** and paragraphs are rendered.
function renderText(container, text) {
  for (const para of text.split(/\n{2,}/)) {
    const p = el("p");
    para.split(/(\*\*[^*]+\*\*)/).forEach(part => {
      if (/^\*\*[^*]+\*\*$/.test(part)) p.appendChild(el("b", null, part.slice(2, -2)));
      else p.appendChild(document.createTextNode(part));
    });
    container.appendChild(p);
  }
}

function addUser(text) { log.appendChild(el("div", "msg user", text)); scroll(); }
function scroll() { window.scrollTo(0, document.body.scrollHeight); }

function addAgent(r) {
  const box = el("div", "msg");
  renderText(box, r.answer);
  if (r.caveats && r.caveats.length) {
    const ul = el("ul", "caveats");
    r.caveats.forEach(c => ul.appendChild(el("li", null, c)));
    box.appendChild(ul);
  }
  box.appendChild(el("div", "meta", `confidence: ${r.confidence} · status: ${r.status}`));
  const d = el("details");
  d.appendChild(el("summary", null, "How I got this"));
  d.appendChild(el("div", "meta", "1. Plan: the question as structured JSON (from the LLM, schema-validated)"));
  d.appendChild(el("pre", null, JSON.stringify(r.plan, null, 2)));
  d.appendChild(el("div", "meta", "2. Facts: computed by deterministic code from stored data. Every number in the answer comes from here."));
  d.appendChild(el("pre", null, r.facts ? JSON.stringify(r.facts, null, 2) : "(none: no data needed for this reply)"));
  box.appendChild(d);
  log.appendChild(box); scroll();
}

async function ask(text) {
  addUser(text);
  const waiting = el("div", "msg meta", "Thinking…"); log.appendChild(waiting); scroll();
  send.disabled = true;
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify({ message: text, session_id: sessionId }) });
    const data = await res.json();
    waiting.remove();
    if (!res.ok) { log.appendChild(el("div", "msg", "Error: " + (data.detail || res.status))); return; }
    setSession(data.session_id);
    addAgent(data);
  } catch (e) {
    waiting.remove(); log.appendChild(el("div", "msg", "Network error: " + e.message));
  } finally { send.disabled = false; input.focus(); }
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault(); const t = input.value.trim(); if (!t) return; input.value = ""; ask(t);
});
document.getElementById("new").addEventListener("click", () => { setSession(null); log.innerHTML = ""; input.focus(); });
const chips = document.getElementById("chips");
EXAMPLES.forEach(q => { const b = el("button", "chip", q); b.type = "button"; b.onclick = () => ask(q); chips.appendChild(b); });
</script>
</body>
</html>
